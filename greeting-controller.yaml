apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopf-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kopf-role-binding
subjects:
  - kind: ServiceAccount
    name: kopf-account
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting-controller
  template:
    metadata:
      labels:
        app: greeting-controller
    spec:
      serviceAccountName: kopf-account
      containers:
      - name: controller
        image: titoyannis/fruit-controller:v1
        imagePullPolicy: Always